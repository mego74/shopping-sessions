name: bench
# Linux x86 A/B timing: candidate (the pushed `bench` commit) vs a baseline commit, interleaved
# on the same runner. Baseline = contents of .github/bench-base (a commit SHA), else origin/main.
on:
  push:
    branches: [bench]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          mkdir -p results
          R=results/$(git rev-parse --short HEAD)-${{ matrix.job }}.txt
          { echo "commit $(git rev-parse HEAD)"; lscpu | egrep 'Model name|^CPU\(s\)|L2|L3' | cut -c1-120; uname -r;
            echo "thp $(cat /sys/kernel/mm/transparent_hugepage/enabled)"; } | tee $R
      - name: Data
        run: |
          curl -sSL -o /tmp/gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          cd /tmp && unzip -q gen.zip && cd generator && cargo build --release -q
          EV=$(cat $GITHUB_WORKSPACE/.github/bench-events 2>/dev/null || echo 20000000); ./target/release/generate --seed 7 --events $EV --clicks $((EV / 4)) --output /tmp/p20
      - name: Build candidate, variants and baseline
        run: |
          R=results/$(git rev-parse --short HEAD)-${{ matrix.job }}.txt
          BASE=$(cat .github/bench-base 2>/dev/null || git rev-parse origin/main)
          echo "baseline $BASE" | tee -a $R
          CXX="g++ -O3 -march=x86-64-v3 -mtune=cascadelake -std=c++17 -pthread -static"
          $CXX -g -o /tmp/cand src/pipeline.cpp
          git show $BASE:src/pipeline.cpp > /tmp/base.cpp && $CXX -o /tmp/base /tmp/base.cpp
          echo "base cand" > /tmp/bins
          # optional variants: lines "name -DFLAG ..." in .github/bench-variants
          if [ -f .github/bench-variants ]; then while read -r name flags; do [ -z "$name" ] && continue
            $CXX $flags -o /tmp/$name src/pipeline.cpp && echo -n " $name" >> /tmp/bins; echo "variant $name: $flags" | tee -a $R; done < .github/bench-variants; fi
          # PGO variant: instrumented build trained on a 1M-event dev set, then rebuilt with the profile
          /tmp/generator/target/release/generate --seed 3 --events 1000000 --clicks 250000 --output /tmp/train >/dev/null
          mkdir -p /tmp/pgo && cd /tmp/pgo && cp $GITHUB_WORKSPACE/src/pipeline.cpp . 
          $CXX -fprofile-generate -fprofile-update=atomic -c -o pipeline.o pipeline.cpp && $CXX -fprofile-generate -o /tmp/pgogen pipeline.o
          rm -rf /tmp/tout; NCPU=4 /tmp/pgogen /tmp/train /tmp/tout && rm -rf /tmp/tout && NCPU=4 /tmp/pgogen /tmp/train /tmp/tout; ls -la /tmp/pgo | tee -a $GITHUB_WORKSPACE/$R
          $CXX -fprofile-use -fprofile-correction -c -o pipeline.o pipeline.cpp 2>&1 | head -5 | tee -a $GITHUB_WORKSPACE/$R; $CXX -o /tmp/pgo_bin pipeline.o && echo -n " pgo_bin" >> /tmp/bins
          cd $GITHUB_WORKSPACE
          # clang build of the candidate (static, same target flags)
          for CC in clang++-18 clang++; do if command -v $CC >/dev/null; then
            $CC --version | head -1 | tee -a $R
            $CC -O3 -march=x86-64-v3 -mtune=cascadelake -std=c++17 -pthread -static -o /tmp/clang_bin src/pipeline.cpp 2>&1 | tail -3 | tee -a $R && echo -n " clang_bin" >> /tmp/bins; break; fi; done
          # clang builds inside candidate Dockerfiles (the toolchain the scorer would use)
          for v in trixie noble; do if [ -f docker/Dockerfile.clang-$v ]; then
            if docker build -q -f docker/Dockerfile.clang-$v -t ss:$v . > /tmp/db_$v.txt 2>&1; then id=$(docker create ss:$v) && docker cp $id:/pipeline /tmp/c_$v && docker rm $id >/dev/null && echo -n " c_$v" >> /tmp/bins; echo "docker clang $v built" | tee -a $R; else echo "docker clang $v FAILED" | tee -a $R; tail -5 /tmp/db_$v.txt | tee -a $R; fi; fi; done
          tr -d '\n' < /tmp/bins > /tmp/bins2; echo >> /tmp/bins2; cat /tmp/bins2
      - name: Correctness gate (scorer build flags)
        run: |
          R=results/$(git rev-parse --short HEAD)-${{ matrix.job }}.txt
          cd /tmp && curl -sSL -o st.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/starter-duckdb.zip && unzip -q -o st.zip -d st
          curl -sSL -o da.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/dev-answer.zip && unzip -q -o da.zip -d da
          pip install -q polars pyarrow >/dev/null 2>&1 || pip install -q --break-system-packages polars pyarrow >/dev/null 2>&1
          /tmp/generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output /tmp/dev >/dev/null
          SD=$(dirname $(find /tmp/st -name run_fixtures.py | head -1)); FX=$(find /tmp/st -type d -name fixtures | head -1); DA=$(dirname $(find /tmp/da -name user_daily.csv | head -1))
          cd $GITHUB_WORKSPACE
          for B in cand pgo_bin clang_bin c_trixie c_noble; do [ -x /tmp/$B ] || continue
            { echo "== correctness $B"; NCPU=4 python3 $SD/run_fixtures.py $FX -- /tmp/$B | tail -1
              rm -rf /tmp/devout; NCPU=4 /tmp/$B /tmp/dev /tmp/devout && (cd $SD && python3 compare.py /tmp/devout $DA | tail -1); } 2>&1 | tee -a $R; done
      - name: A/B timing
        run: |
          R=results/$(git rev-parse --short HEAD)-${{ matrix.job }}.txt
          cat /tmp/p20/events/*.csv /tmp/p20/clicks/*.csv /tmp/p20/links/*.csv > /dev/null
          BINS=$(cat /tmp/bins2)
          for i in 1 2 3 4 5 6 7; do for b in $BINS; do rm -rf /tmp/out
            rc=0; /usr/bin/time -f "AB $b wall %e user %U sys %S" env NCPU=4 PIPE_VERBOSE=1 $(cat .github/bench-env 2>/dev/null) /tmp/$b /tmp/p20 /tmp/out 2>/tmp/err_$b.txt >/dev/null || rc=$?
            if [ $rc -ne 0 ]; then { echo "FAIL $b rc=$rc"; tail -8 /tmp/err_$b.txt; dmesg 2>/dev/null | tail -3; } | tee -a $R; else tail -1 /tmp/err_$b.txt | tee -a $R; fi
            if [ $i = 7 ]; then { echo "-- last $b phases"; grep -v "user_daily rows=" /tmp/err_$b.txt; } >> $R; fi
          done; done
          python3 - "$R" <<'PY' | tee -a $R
          import sys, statistics as st
          v = {}
          for ln in open(sys.argv[1]):
              if ln.startswith("AB "):
                  p = ln.split(); v.setdefault(p[1], []).append((float(p[3]), float(p[5])))
          bm = st.median(x[0] for x in v["base"])
          for k in v:
              w = sorted(x[0] for x in v[k]); u = sorted(x[1] for x in v[k])
              print(f"SUMMARY {k:10s}: median wall {st.median(w):.3f}s  min {w[0]:.3f}s  median user {st.median(u):.2f}s  ratio {st.median(w)/bm:.3f}")
          PY
      - name: Container overhead (docker start/finish timestamps, scorer flags)
        if: matrix.job == 1
        continue-on-error: true
        run: |
          R=results/$(git rev-parse --short HEAD)-${{ matrix.job }}.txt
          mkdir -p /tmp/e0 && printf 'int main(){return 0;}' > /tmp/e0/t.c && gcc -static -O2 -o /tmp/e0/exit0 /tmp/e0/t.c
          printf 'FROM scratch\nCOPY exit0 /exit0\nCMD ["/exit0"]\n' > /tmp/e0/Dockerfile && docker build -q -t ss:exit0 /tmp/e0 >/dev/null
          docker build -q -t ss:cand . >/dev/null
          mkdir -p /tmp/dout /tmp/dscr && chmod 777 /tmp/dout /tmp/dscr
          FLAGS="--network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --cpus 4 --memory 14g --memory-swap 14g --user 1000:1000 -v /tmp/p20:/data:ro -v /tmp/dout:/output -v /tmp/dscr:/scratch -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch -e NCPU=4 -e MEM_GB=14 -e PIPE_VERBOSE=1"
          span() { docker inspect -f '{{.State.StartedAt}} {{.State.FinishedAt}}' $1 | python3 -c "import sys,datetime as d; a,b=sys.stdin.read().split(); f=lambda x: d.datetime.fromisoformat(x[:26].rstrip('Z')); print(f'{(f(b)-f(a)).total_seconds():.3f}')"; }
          for i in 1 2 3 4 5; do cid=$(docker run -d $FLAGS ss:exit0); docker wait $cid >/dev/null; echo "OVERHEAD exit0 container span $(span $cid)s" | tee -a $R; docker rm $cid >/dev/null; done
          for i in 1 2 3 4; do sudo rm -rf /tmp/dout/*; cid=$(docker run -d $FLAGS ss:cand); docker wait $cid >/dev/null
            echo "OVERHEAD pipeline container span $(span $cid)s, internal $(docker logs $cid 2>&1 | grep -E 'released|written' | tail -1)" | tee -a $R; docker rm $cid >/dev/null; done
      - name: Perf (candidate)
        continue-on-error: true
        run: |
          R=results/$(git rev-parse --short HEAD)-${{ matrix.job }}.txt
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -q linux-tools-azure >/dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); [ -z "$PERF" ] && PERF=perf
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          rm -rf /tmp/out; $PERF record -F 4999 -o /tmp/perf.data env NCPU=4 /tmp/cand /tmp/p20 /tmp/out >/dev/null 2>&1
          { echo "== perf by symbol"; $PERF report -i /tmp/perf.data --no-children --sort sym --stdio 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30;
            echo "== perf by srcline (top)"; $PERF report -i /tmp/perf.data --no-children --sort srcline --stdio 2>/dev/null | grep -v '^#' | grep -v '^$' | head -120; } | tee -a $R
          for b in $(cat /tmp/bins2); do rm -rf /tmp/out; $PERF stat -x, -e instructions:u,cycles:u,branch-misses:u,instructions:k,cycles:k -o /tmp/ps_$b.txt env NCPU=4 /tmp/$b /tmp/p20 /tmp/out >/dev/null 2>&1
            echo "PSTAT $b $(grep -v '^#' /tmp/ps_$b.txt | grep -v '^$' | awk -F, '{printf "%s=%.0fM ", $3, $1/1e6}')"; done | tee -a $R
      - name: Callgrind (instruction counts per source line)
        if: matrix.job == 1
        continue-on-error: true
        run: |
          sudo apt-get install -y -q valgrind >/dev/null 2>&1
          rm -rf /tmp/cgout; NCPU=2 timeout 900 valgrind --tool=callgrind --dump-instr=no --callgrind-out-file=/tmp/cg.out /tmp/cand /tmp/dev /tmp/cgout > /dev/null 2>&1
          C=results/cg-$(git rev-parse --short HEAD).txt
          { callgrind_annotate /tmp/cg.out 2>/dev/null | head -60; echo "== annotated source"; callgrind_annotate --auto=yes --show-percs=no /tmp/cg.out $GITHUB_WORKSPACE/src/pipeline.cpp 2>/dev/null; } > $C; wc -l $C
      - name: Publish
        if: always()
        run: |
          cp -r results /tmp/results
          git config user.name "bench-bot"; git config user.email "bench-bot@users.noreply.github.com"
          if git fetch -q origin bench-results; then git checkout -q -B bench-results origin/bench-results; else git checkout -q --orphan bench-results; git rm -rq --cached . ; rm -rf ./*; fi
          cp /tmp/results/*.txt . && git add *.txt && git commit -qm "bench $(ls /tmp/results)"
          for i in 1 2 3 4 5 6 7 8; do git push -q origin bench-results && break; sleep $((RANDOM % 5 + 2)); git pull -q --rebase origin bench-results; done
