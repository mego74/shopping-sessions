name: bench
# Linux x86 A/B timing: candidate (the pushed `bench` commit) vs a baseline commit, interleaved
# on the same runner. Baseline = contents of .github/bench-base (a commit SHA), else origin/main.
on:
  push:
    branches: [bench]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          mkdir -p results
          R=results/$(git rev-parse --short HEAD).txt
          { echo "commit $(git rev-parse HEAD)"; lscpu | egrep 'Model name|^CPU\(s\)|L2|L3' | cut -c1-120; uname -r;
            echo "thp $(cat /sys/kernel/mm/transparent_hugepage/enabled)"; } | tee $R
      - name: Data
        run: |
          curl -sSL -o /tmp/gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          cd /tmp && unzip -q gen.zip && cd generator && cargo build --release -q
          ./target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output /tmp/p20
      - name: Build candidate, variants and baseline
        run: |
          R=results/$(git rev-parse --short HEAD).txt
          BASE=$(cat .github/bench-base 2>/dev/null || git rev-parse origin/main)
          echo "baseline $BASE" | tee -a $R
          CXX="g++ -O3 -march=x86-64-v3 -mtune=cascadelake -std=c++17 -pthread -static"
          $CXX -g -o /tmp/cand src/pipeline.cpp
          git show $BASE:src/pipeline.cpp > /tmp/base.cpp && $CXX -o /tmp/base /tmp/base.cpp
          echo "base cand" > /tmp/bins
          # optional variants: lines "name -DFLAG ..." in .github/bench-variants
          if [ -f .github/bench-variants ]; then while read -r name flags; do [ -z "$name" ] && continue
            $CXX $flags -o /tmp/$name src/pipeline.cpp && echo -n " $name" >> /tmp/bins; echo "variant $name: $flags" | tee -a $R; done < .github/bench-variants; fi
          tr -d '\n' < /tmp/bins > /tmp/bins2; echo >> /tmp/bins2; cat /tmp/bins2
      - name: A/B timing
        run: |
          R=results/$(git rev-parse --short HEAD).txt
          cat /tmp/p20/events/*.csv /tmp/p20/clicks/*.csv /tmp/p20/links/*.csv > /dev/null
          BINS=$(cat /tmp/bins2)
          for i in 1 2 3 4 5 6 7; do for b in $BINS; do rm -rf /tmp/out
            /usr/bin/time -f "AB $b wall %e user %U sys %S" env NCPU=4 PIPE_VERBOSE=1 /tmp/$b /tmp/p20 /tmp/out 2>/tmp/err_$b.txt >/dev/null
            tail -1 /tmp/err_$b.txt | tee -a $R
            [ $i = 7 ] && { echo "-- last $b phases"; cat /tmp/err_$b.txt | grep -v "user_daily rows=" ; } >> $R
          done; done
          python3 - "$R" <<'PY' | tee -a $R
          import sys, statistics as st
          v = {}
          for ln in open(sys.argv[1]):
              if ln.startswith("AB "):
                  p = ln.split(); v.setdefault(p[1], []).append((float(p[3]), float(p[5])))
          bm = st.median(x[0] for x in v["base"])
          for k in v:
              w = sorted(x[0] for x in v[k]); u = sorted(x[1] for x in v[k])
              print(f"SUMMARY {k:10s}: median wall {st.median(w):.3f}s  min {w[0]:.3f}s  median user {st.median(u):.2f}s  ratio {st.median(w)/bm:.3f}")
          PY
      - name: Perf (candidate)
        continue-on-error: true
        run: |
          R=results/$(git rev-parse --short HEAD).txt
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -q linux-tools-azure >/dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); [ -z "$PERF" ] && PERF=perf
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          rm -rf /tmp/out; $PERF record -F 4999 -o /tmp/perf.data env NCPU=4 /tmp/cand /tmp/p20 /tmp/out >/dev/null 2>&1
          { echo "== perf by symbol"; $PERF report -i /tmp/perf.data --no-children --sort sym --stdio 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30;
            echo "== perf by srcline (top)"; $PERF report -i /tmp/perf.data --no-children --sort srcline --stdio 2>/dev/null | grep -v '^#' | grep -v '^$' | head -120; } | tee -a $R
      - name: Publish
        if: always()
        run: |
          cp -r results /tmp/results
          git config user.name "bench-bot"; git config user.email "bench-bot@users.noreply.github.com"
          if git fetch -q origin bench-results; then git checkout -q -B bench-results origin/bench-results; else git checkout -q --orphan bench-results; git rm -rq --cached . ; rm -rf ./*; fi
          cp /tmp/results/*.txt . && git add *.txt && git commit -qm "bench $(ls /tmp/results)" && git push -q origin bench-results
